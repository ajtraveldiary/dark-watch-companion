name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only needs to read the code; it can't push to or change the repository.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Check Cloudflare secrets
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the Cloudflare token (prints no secrets)
        if: steps.secrets.outputs.ready == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          verify=$(curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Token valid: $(echo "$verify" | jq -r '.success') / status: $(echo "$verify" | jq -r '.result.status // "unknown"')"
          accts=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          echo "Accounts this token can see: $(echo "$accts" | jq '.result | length')"
          if echo "$accts" | jq -e --arg id "$CF_ACCOUNT" '.result[] | select(.id == $id)' > /dev/null; then
            echo "CLOUDFLARE_ACCOUNT_ID matches an account the token can access."
          else
            echo "::warning::CLOUDFLARE_ACCOUNT_ID is NOT one of the accounts this token can access."
          fi
          scripts=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts")
          echo "Can list Workers in that account: $(echo "$scripts" | jq -r '.success') $(echo "$scripts" | jq -r '[.errors[]?.message] | join("; ")')"

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set the photo owner key (if provided)
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PHOTO_ADMIN_KEY: ${{ secrets.PHOTO_ADMIN_KEY }}
        run: |
          if [ -n "$PHOTO_ADMIN_KEY" ]; then
            printf '%s' "$PHOTO_ADMIN_KEY" | npx wrangler secret put ADMIN_KEY
          else
            echo "::notice::Add a PHOTO_ADMIN_KEY repository secret to enable owner photo uploads."
          fi

      - name: Tell search engines the site changed (IndexNow; Bing, Yandex and others)
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: |
          sleep 20
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" \
            -H "content-type: application/json; charset=utf-8" \
            -d '{"host":"dark-watch-companion.workdesk.workers.dev","key":"d4rkw4tch5e0c1a2b3c4d5e6f7a8b9c0","keyLocation":"https://dark-watch-companion.workdesk.workers.dev/d4rkw4tch5e0c1a2b3c4d5e6f7a8b9c0.txt","urlList":["https://dark-watch-companion.workdesk.workers.dev/","https://dark-watch-companion.workdesk.workers.dev/llms.txt"]}'
